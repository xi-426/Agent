spring:
  application:
    name: enterprise-agent
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:demo-key-not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.yan.agent: DEBUG

