spring:
  application:
    name: zhiyu-agent

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/enterprise_agent}
    username: ${POSTGRES_USER:agent}
    password: ${POSTGRES_PASSWORD:agent_local_password}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

  ai:
    model:
      chat: openai
      embedding: ollama

    openai:
      api-key: ${DEEPSEEK_API_KEY:demo-key-not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Personal knowledge base and todo Agent
    version: 0.0.1-SNAPSHOT

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-system}]"
  level:
    root: INFO
    com.yan.agent: DEBUG

app:
  document:
    storage-root: ${DOCUMENT_STORAGE_ROOT:./data/uploads}
    # Product safety limits, not RAG quality optima. See docs/PARAMETER_EVIDENCE.md.
    max-size-bytes: 10485760
    max-batch-files: 20
    max-batch-total-size-bytes: 52428800
    # Selected from 17 real-corpus chunk configurations on 2026-08-10.
    chunk-size: 800
    chunk-overlap: 120
  rag:
    # Calibrated on the local school-document validation split.
    # Re-run calibration after changing the corpus, chunking or embedding model.
    top-k: 8
    max-distance: 0.3495513922998467
  chat-memory:
    # Explicit product policy defaults; PostgreSQL remains the complete history source.
    max-messages: 20
    ttl-minutes: 1440
  todo-item:
    # Explicit product policy for how long a pending confirmation stays valid.
    confirmation-ttl-minutes: 10
  security:
    jwt-secret: ${JWT_SECRET:local-development-jwt-secret-must-be-at-least-32-bytes}
    # Explicit local-demo policies; not benchmark-derived values.
    jwt-ttl-minutes: 120
    max-chat-requests-per-minute: 20
